# Explicit schema definition: without this, graphql-js auto-detects any type literally named
# "Query"/"Mutation"/"Subscription" as a root operation type. We have a domain type named
# `Subscription` (fact-sheet subscribers) that is NOT a GraphQL root Subscription type, so we
# must declare roots explicitly to avoid that collision.
schema {
  query: Query
  mutation: Mutation
}

# --- Scalars -------------------------------------------------

scalar DateTime
scalar JSON

# --- Enums ---------------------------------------------------

enum FactSheetStatus {
  ACTIVE
  ARCHIVED
}

# Real LeanIX has 4 quality-seal states (confirmed via lxState facet values in LeanIX's
# official leanix-reporting SDK guide), not just 2 — see docs/RESEARCH_LEANIX_REAL_API.md §6.
enum QualitySeal {
  BROKEN
  APPROVED
  DRAFT
  REJECTED
}

enum SubscriptionType {
  RESPONSIBLE
  ACCOUNTABLE
  OBSERVER
}

enum SyncRunStatus {
  CREATED
  RUNNING
  FINISHED
  FAILED
  CANCELLED
}

# --- Inputs --------------------------------------------------

input BaseFactSheetInput {
  name: String!
  type: String!
  description: String
  externalId: String
  tags: [TagInput]
  subscriptions: [SubscriptionInput]
}

input TagInput {
  name: String!
  group: TagGroupInput
}

input TagGroupInput {
  name: String!
}

input SubscriptionInput {
  user: UserInput!
  type: SubscriptionType!
  roles: [String]
}

input UserInput {
  id: ID
  email: String
  name: String
}

input FilterInput {
  # Real LeanIX form — matches the real facet-based filter model exactly (see
  # docs/RESEARCH_LEANIX_REAL_API.md §3). Well-known facetKeys: "FactSheetTypes" (type
  # technicalKey), "_TAGS_" (tag ids); any other key is looked up as a custom attribute's
  # technicalKey.
  facetFilters: [FacetFilterInput]

  # --- Mock-only convenience form (kept for backward compatibility; not in real LeanIX) ---
  factSheetType: String
  status: FactSheetStatus
  fieldFilters: [FieldFilterInput]
  relationFilters: [RelationFilterInput]
}

input FacetFilterInput {
  facetKey: String!
  operator: FacetOperator = OR
  keys: [String]!
}

enum FacetOperator {
  OR
  AND
}

input FieldFilterInput {
  key: String!
  values: [String]!
  operator: FilterOperator = EQUALS
}

enum FilterOperator {
  EQUALS
  CONTAINS
  STARTS_WITH
  ENDS_WITH
  IN
  NOT_IN
}

input RelationFilterInput {
  relationType: String!
  targetType: String
  targetId: ID
}

input SortInput {
  mode: SortMode = BY_FIELD
  key: String
  direction: SortDirection = ASC
}

enum SortMode {
  BY_FIELD
  BY_NAME
  BY_UPDATED_AT
}

enum SortDirection {
  ASC
  DESC
}

input Patch {
  op: PatchOperation!
  path: String!
  value: JSON
}

enum PatchOperation {
  add
  replace
  remove
}

# --- Types ---------------------------------------------------

# Real LeanIX exposes fact sheets as a `BaseFactSheet` GraphQL interface with one concrete
# implementing type per fact sheet type technicalKey (Application, ITComponent, ...), queried
# either via the interface's common fields or via inline fragments for type-specific fields
# (`... on Application { functionalSuitability } `) — see docs/RESEARCH_LEANIX_REAL_API.md §7.
interface BaseFactSheet {
  id: ID!
  name: String!
  type: String!
  description: String
  displayName: String!
  externalId: String
  lifecycle: Lifecycle
  qualitySeal: QualitySeal!
  # Real LeanIX's field name for quality-seal state, with different value casing
  # ("APPROVED" / "BROKEN_QUALITY_SEAL") — see docs/RESEARCH_LEANIX_REAL_API.md §4.
  # Read-only derived value; patch /qualitySeal to change it (updates both fields).
  lxState: String!
  # Optimistic-concurrency revision counter, confirmed real (used in updateFactSheet's real
  # signature) — see docs/RESEARCH_LEANIX_REAL_API.md §6. Increments on every update.
  rev: Int!
  completion: Float!
  status: FactSheetStatus!
  trashBin: Boolean!
  archivedAt: DateTime
  autoDeleteAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
  createdBy: String!
  updatedBy: String!
  tags: [Tag!]!
  subscriptions: [Subscription!]!
  attributes: [AttributeValue!]!
  relations: [Relation!]!
  comments: [Comment!]!
}

type Application implements BaseFactSheet {
  id: ID!
  name: String!
  type: String!
  description: String
  displayName: String!
  externalId: String
  lifecycle: Lifecycle
  qualitySeal: QualitySeal!
  lxState: String!
  rev: Int!
  completion: Float!
  status: FactSheetStatus!
  trashBin: Boolean!
  archivedAt: DateTime
  autoDeleteAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
  createdBy: String!
  updatedBy: String!
  tags: [Tag!]!
  subscriptions: [Subscription!]!
  attributes: [AttributeValue!]!
  relations: [Relation!]!
  comments: [Comment!]!
  # Named fields matching real LeanIX's inline-fragment shape for Application — see
  # docs/RESEARCH_LEANIX_REAL_API.md §7. Also available generically via `attributes` (support both).
  functionalSuitability: String
  technicalSuitability: String
  businessCriticality: String
}

