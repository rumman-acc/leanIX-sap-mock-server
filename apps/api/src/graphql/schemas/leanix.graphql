# --- Connection Types (Relay) --------------------------------

type FactSheetConnection {
  totalCount: Int!
  edges: [FactSheetEdge!]!
  pageInfo: PageInfo!
  # Real LeanIX facet-discovery field (docs/RESEARCH_LEANIX_REAL_API.md §3) — lets a client
  # discover valid facetKey/keys combinations for FilterInput.facetFilters.
  filterOptions: FilterOptions!
}

type FilterOptions {
  facets: [Facet!]!
}

type Facet {
  facetKey: String!
  results: [FacetResultItem!]!
}

type FacetResultItem {
  name: String!
  key: String!
}

type FactSheetEdge {
  node: BaseFactSheet!
  cursor: String!
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type SearchConnection {
  totalCount: Int!
  edges: [SearchEdge!]!
  pageInfo: PageInfo!
}

type SearchEdge {
  node: SearchResult!
  cursor: String!
}

type SearchResult {
  id: ID!
  name: String!
  type: String!
  description: String
  highlight: String
}

# --- Queries -------------------------------------------------

type Query {
  factSheet(id: ID!): BaseFactSheet
  allFactSheets(
    filter: FilterInput
    sort: SortInput
    first: Int
    after: String
  ): FactSheetConnection!
  search(query: String!, first: Int, after: String): SearchConnection!
  allFactSheetTypes: [FactSheetType!]!
  factSheetType(technicalKey: String!): FactSheetType
}

# --- Mutations -----------------------------------------------

type Mutation {
  # `patches` is real LeanIX's actual createFactSheet contract (create + apply patches in one
  # call) — see docs/RESEARCH_LEANIX_REAL_API.md §6. Optional: omit for this mock's original form.
  createFactSheet(input: BaseFactSheetInput!, patches: [Patch!]): FactSheetPayload!
  # `rev`/`comment`/`validateOnly` match real LeanIX's confirmed updateFactSheet signature — see
  # docs/RESEARCH_LEANIX_REAL_API.md §6. All optional: omit `rev` to skip the optimistic-
  # concurrency check (this mock's original behavior); `validateOnly: true` runs every patch's
  # validation and then rolls back, returning the fact sheet unchanged if nothing failed.
  updateFactSheet(id: ID!, rev: Int, patches: [Patch!]!, comment: String, validateOnly: Boolean): FactSheetPayload!
  archiveFactSheet(id: ID!): FactSheetPayload!
  reviveFactSheet(id: ID!): FactSheetPayload!
  deleteFactSheet(id: ID!): DeletePayload!
  # Real, confirmed dedicated relation mutations (docs/RESEARCH_LEANIX_REAL_API.md §6) — an
  # alternative to relation patches on updateFactSheet, which remain fully supported too.
  # Real argument names weren't independently confirmed beyond "from, to, type" — best-effort
  # naming here.
  upsertRelation(from: ID!, to: ID!, type: String!, description: String): Relation!
  deleteRelation(id: ID!): DeletePayload!
  createComment(factSheetId: ID!, message: String!): Comment!
}

type FactSheetPayload {
  factSheet: BaseFactSheet
  errors: [Error!]
}

type DeletePayload {
  id: ID!
  success: Boolean!
}

type Error {
  message: String!
  code: String
  path: String
}
